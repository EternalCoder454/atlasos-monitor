name: CI

# Docs-only changes build nothing.
on:
  push:
    branches: [main, beta]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Every action and reusable workflow is pinned by commit. atlas-framework's
# app checks are at the commit of the release tag Cargo.toml pins the crates
# to; the framework job checks that they agree.
jobs:
  # atlas-framework's design rules (no default buttons, no QML file named
  # like an Atlas.Ui type), at the release the crates are pinned to.
  atlas:
    name: Atlas app checks
    uses: EternalCoder454/atlas-framework/.github/workflows/app-checks.yml@7a114a112bd1fff4fe3d6facc81b0a81e5d2db30 # v1.4.0
    with:
      framework-ref: v1.4.0

  # Atlas.Ui (atlas-ui), which the app builds against, is in no repository:
  # atlas-framework's RPMs at the release the crates are pinned to, built
  # once per release and Fedora Qt version and cached.
  framework:
    name: atlas-framework RPMs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: registry.fedoraproject.org/fedora:44
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Tools for checkout and cache
        run: dnf -y install git-core tar zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            Cargo.toml
            .github/workflows/ci.yml
          sparse-checkout-cone-mode: false
      - name: The release Cargo.toml pins
        id: ref
        run: |
          refs=$(grep -oE 'github\.com/EternalCoder454/atlas-framework[^}]*tag = "v[0-9]+\.[0-9]+\.[0-9]+"' Cargo.toml |
            grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -u)
          if [ "$(printf '%s\n' "$refs" | grep -c .)" != 1 ]; then
            echo "::error::Cargo.toml must pin every atlas-framework crate to one release tag (found: ${refs:-none})"; exit 1
          fi
          # The tag's commit (peeled, for an annotated tag).
          commit=$(git ls-remote https://github.com/EternalCoder454/atlas-framework "refs/tags/$refs" "refs/tags/$refs^{}" |
            sort -k2 | awk 'END { print $1 }')
          if ! [[ $commit =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::atlas-framework has no tag $refs"; exit 1
          fi
          if ! grep -qF "app-checks.yml@$commit # $refs" .github/workflows/ci.yml || ! grep -qF "framework-ref: $refs" .github/workflows/ci.yml; then
            echo "::error::the Atlas app checks job in ci.yml must use $refs: app-checks.yml@$commit # $refs and framework-ref: $refs"; exit 1
          fi
          echo "ref=$refs" >> "$GITHUB_OUTPUT"
      # atlas-ui needs the Qt minor it was built with: a Fedora Qt update
      # (today's metadata, loaded by the dnf install above) builds them again.
      - name: Fedora's Qt
        id: qt
        run: |
          qt=$(dnf -q repoquery --latest-limit=1 --qf '%{name}-%{evr}\n' qt6-qtbase qt6-qtdeclarative | sort | tr '\n' '_')
          case $qt in qt6-qtbase-*_qt6-qtdeclarative-*_) ;; *) echo "::error::could not read Fedora's Qt version ($qt)"; exit 1 ;; esac
          echo "qt=$qt" >> "$GITHUB_OUTPUT"
      - name: Cached RPMs
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out
          key: atlas-framework-rpms-f44-${{ steps.ref.outputs.ref }}-${{ steps.qt.outputs.qt }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: EternalCoder454/atlas-framework
          ref: ${{ steps.ref.outputs.ref }}
          path: atlas-framework
          persist-credentials: false
      - name: Build the RPMs
        if: steps.cache.outputs.cache-hit != 'true'
        run: atlas-framework/packaging/build-rpm.sh "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-framework-rpms
          path: out/*.rpm
          if-no-files-found: error
          retention-days: 1

  check:
    name: fmt, clippy, tests
    needs: framework
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: registry.fedoraproject.org/fedora:44
    env:
      # No debug info: faster links and a smaller cache; tests don't need it.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Tools for checkout and cache
        run: dnf -y install git-core tar zstd cargo rustfmt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # First: it needs nothing built, so a formatting slip fails in seconds.
      - name: Format
        run: cargo fmt --all --check
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-framework-rpms
          # In the container: runner.temp would be the host's path.
          path: /tmp/atlas-framework-rpms
      - name: Build dependencies
        run: |
          dnf -y install dnf5-plugins clippy \
            /tmp/atlas-framework-rpms/atlas-ui-[0-9]*.rpm \
            /tmp/atlas-framework-rpms/atlas-symbols-fonts-[0-9]*.rpm
          dnf -y builddep packaging/atlas-monitor.spec
      # The crate downloads and the dependencies' build output (not the
      # workspace's own crates), keyed on Cargo.lock and the rustc version.
      # Saved from main and beta only, so pull requests can't evict them.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: f44
          save-if: ${{ github.event_name == 'push' }}
      # --locked: also fails when Cargo.lock and the atlas-framework tag disagree.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  # The release build, as AtlasOS builds it. Its CMake build (Corrosion's cargo
  # target in it) is cached, so it compiles only what changed.
  rpm:
    name: RPM
    needs: framework
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: registry.fedoraproject.org/fedora:44
    env:
      CARGO_HOME: /github/home/.cargo
      ATLAS_BUILD_CACHE: /github/home/rpm-build
    steps:
      - name: Tools for checkout and cache
        run: dnf -y install git-core tar zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-framework-rpms
          # In the container: runner.temp would be the host's path.
          path: /tmp/atlas-framework-rpms
      - name: Week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # Keyed on what the dependencies' build depends on. The week is in the
      # prefix: each week starts from nothing, so artifacts of old dependency
      # versions don't pile up (cargo never prunes its target), and a Fedora
      # toolchain update (which build-rpm.sh notices and starts over for)
      # costs one full build. Saved from pushes only, like rust-cache above.
      - name: Cached build
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /github/home/.cargo/registry
            /github/home/.cargo/git
            /github/home/rpm-build
          key: rpm-f44-${{ needs.framework.outputs.ref }}-${{ steps.week.outputs.week }}-${{ hashFiles('Cargo.lock', 'packaging/atlas-monitor.spec') }}
          restore-keys: rpm-f44-${{ needs.framework.outputs.ref }}-${{ steps.week.outputs.week }}-
      - name: Build the RPM
        run: ATLAS_LOCAL_RPMS=/tmp/atlas-framework-rpms packaging/build-rpm.sh "$GITHUB_WORKSPACE/out"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            /github/home/.cargo/registry
            /github/home/.cargo/git
            /github/home/rpm-build
          key: ${{ steps.cache.outputs.cache-primary-key }}
