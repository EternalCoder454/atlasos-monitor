# cargo-deny: what may be in the dependency tree of Telamon Monitor
# (docs/SECURITY.md, "Build hardening and supply chain"). CI runs
# `cargo deny check` on every change and every week
# (.github/workflows/security.yml); locally:
#   cargo install --locked cargo-deny && cargo deny check

[graph]
# What the package is built for (Telamon OS images are x86_64 and aarch64
# Fedora); crates only for other systems are not looked at.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
version = 2
# A known vulnerability, an unmaintained crate or a yanked version in the lock
# file fails the check. Ignore an advisory only with the reason and a date to
# look at it again, in `ignore = [{ id = "RUSTSEC-...", reason = "..." }]`.
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
# Telamon Monitor is MIT; these are the licences its dependencies come under.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate are common in a tree this size (zbus and its
# dependencies, the framework's); they are listed, not refused.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # Monitor talks to D-Bus and reads files, and does no networking of its own
    # (Telamon Updater does the updates): no TLS or HTTP stack comes in through
    # the Rust side, and one would be a surprise.
    { crate = "openssl", reason = "Monitor does no networking of its own; a TLS library is new attack surface" },
    { crate = "openssl-sys", reason = "see openssl" },
    { crate = "native-tls", reason = "see openssl" },
    { crate = "reqwest", reason = "see openssl" },
    { crate = "ureq", reason = "see openssl" },
    { crate = "hyper", reason = "see openssl" },
]

[sources]
# Only crates.io and the one repository Monitor pins, by tag (see CLAUDE.md,
# "Moving the atlas-framework pin").
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/EternalCoder454/atlas-framework",
]
