[package]
name = "atlas-sysinfo"
description = "System readers for Atlas Monitor: /proc, /sys, hwmon, D-Bus. No Qt."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# statvfs for disk space, a netlink socket for interface addresses, openat
# and getdents for the process scan, pidfds for signalling a process.
rustix = { version = "1.1", features = ["fs", "net", "param", "process"] }
# getpwuid_r: user names through NSS (nss-altfiles, systemd userdb).
libc = "0.2"
# podman's container lists (containers.json), for a container's name.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# udisks2 (drive health) and systemd (services), each reader on a
# current-thread runtime of its own.
# The tokio backend, as atlas-core has it: one async stack in the workspace.
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
# The Stream trait, to empty systemd's signal queues while a call waits.
futures-core = "0.3"

[dev-dependencies]
tempfile = "3"
