[package]
name = "atlas-sysinfo"
description = "System readers for Telamon Monitor: /proc, /sys, hwmon, D-Bus. No Qt."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# uname for System Info, statvfs for disk space, a netlink socket for
# interface addresses, openat and getdents for the process scan, pidfds for
# signalling a process.
rustix = { version = "1.1", features = ["fs", "net", "param", "process", "system"] }
# getpwuid_r: user names through NSS (nss-altfiles, systemd userdb).
libc = "0.2"
# Warnings the app's logger prints (Energy Saver's state file).
log = "0.4"
# podman's container lists (containers.json), for a container's name.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# udisks2 (drive health) and systemd (services), each reader on a
# current-thread runtime of its own.
# The tokio backend, as atlas-framework has it: one async stack everywhere.
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt", "net", "sync", "time"] }
# The Stream trait, to empty systemd's signal queues while a call waits.
futures-core = "0.3"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.7", default-features = false }

[[bench]]
name = "readers"
harness = false
