[package]
name = "atlas-sysinfo"
description = "System readers for Atlas Monitor: /proc, /sys, hwmon, D-Bus. No Qt."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# statvfs for disk space, a netlink socket for interface addresses.
rustix = { version = "1.1", features = ["fs", "net"] }

[dev-dependencies]
tempfile = "3"
