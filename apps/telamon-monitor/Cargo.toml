[package]
name = "telamon-monitor"
description = "Telamon Monitor: the system monitor of Telamon OS (Kirigami UI over CXX-Qt)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

# CMake (Corrosion) links the static library into the C++ executable.
# `rlib` is there so `cargo test` and `cargo clippy` work as usual.
[lib]
name = "telamon_monitor"
crate-type = ["staticlib", "rlib"]

[dependencies]
telamon-framework-ui.workspace = true
atlas-sysinfo = { path = "../../crates/atlas-sysinfo" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
log = { version = "0.4", features = ["std"] }

[build-dependencies]
cxx-qt-build = "0.10"
