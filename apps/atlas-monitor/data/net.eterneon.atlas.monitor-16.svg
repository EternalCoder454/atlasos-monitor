<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 128 128">
  <title>Atlas Monitor, 16 px</title>
  <!-- The tile fills the square, the screen is larger, the grid goes and the
       pulse is thicker with one fewer turn. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a7af4"/>
      <stop offset="1" stop-color="#5b4bd8"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="18" y="28" width="92" height="72" rx="12" fill="#ffffff"/>
  <path fill="none" stroke="#6858e2" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" d="M 30 66 H 44 L 56 42 L 70 88 L 80 66 H 98"/>
</svg>
