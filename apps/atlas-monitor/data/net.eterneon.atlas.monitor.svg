<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Atlas Monitor</title>
  <!-- The Atlas apps' tile, as Atlas Updater's icon has it, with a screen
       showing a pulse on it: Atlas Notes' white, lavender and purple. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a7af4"/>
      <stop offset="1" stop-color="#5b4bd8"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
  <rect x="24" y="32" width="80" height="64" rx="10" fill="#ffffff"/>
  <g fill="none" stroke="#c9c0ff" stroke-width="3" stroke-linecap="round">
    <path d="M 34 48 H 94"/>
    <path d="M 34 80 H 94"/>
  </g>
  <path fill="none" stroke="#6858e2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M 32 64 H 46 L 54 48 L 64 82 L 73 56 L 79 64 H 96"/>
</svg>
