[workspace]
resolver = "3"
members = ["crates/atlas-sysinfo", "apps/atlas-monitor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/EternalCoder454/atlasos-monitor"
rust-version = "1.89"

[workspace.dependencies]
# atlas-core comes from atlasos-updater; to move the pin, see CLAUDE.md.
# (Atlas.Ui is no longer tied to it: it is the installed atlas-ui package.)
atlas-core = { git = "https://github.com/EternalCoder454/atlasos-updater", rev = "20ff489e5e00c0efaf565bf650e84994277dde6d" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
