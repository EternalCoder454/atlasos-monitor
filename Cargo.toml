[workspace]
resolver = "3"
members = ["crates/atlas-sysinfo", "apps/atlas-monitor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/EternalCoder454/atlasos-monitor"
rust-version = "1.89"

[workspace.dependencies]
# The atlas-framework crates (startup, settings, logging, crash reports); to
# move the pin, see CLAUDE.md. Atlas.Ui is not pinned here: it is the
# installed atlas-ui package.
atlas-framework-ui = { git = "https://github.com/EternalCoder454/atlas-framework", rev = "e62871811d07f112b4739b8926e2ec4e70ab21fc" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
